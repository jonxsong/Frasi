[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "frasi-ml"
version = "0.1.0"
description = "Signal-processing and symbolic music pipeline for Frasi"
requires-python = ">=3.11"
dependencies = [
  "librosa>=0.11,<1",
  "music21>=9.3,<10",
  "numpy>=2.0,<3",
  "pretty-midi>=0.2.10,<1",
  "scipy>=1.14,<2",
  "soundfile>=0.13,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-cov>=6,<7", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["frasi_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
