[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["services/api/tests", "services/worker/tests", "ml/tests"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
