[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "frasi-worker"
version = "0.1.0"
description = "Frasi asynchronous transcription worker"
requires-python = ">=3.11"
dependencies = ["frasi-api", "frasi-ml"]

[tool.hatch.build.targets.wheel]
packages = ["frasi_worker"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
