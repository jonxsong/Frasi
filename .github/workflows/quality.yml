name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @frasi/web exec playwright install --with-deps chromium
      - run: pnpm --filter @frasi/web test:e2e

  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install --yes ffmpeg libsndfile1
      - run: python -m pip install -e './services/api[dev]' -e './ml[dev]' -e ./services/worker
      - run: ruff format --check services/api services/worker ml
      - run: ruff check services/api services/worker ml
      - run: mypy services/api/frasi_api services/worker/frasi_worker ml/frasi_ml
      - run: pytest -q
      - run: python ml/benchmarks/run_synthetic.py --check

  containers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: docker compose config --quiet
      - run: docker compose build api worker web
      - run: docker compose up --detach
      - run: pwsh -NoProfile -File infrastructure/scripts/smoke_test.ps1
      - if: always()
        run: docker compose logs --no-color && docker compose down --volumes
