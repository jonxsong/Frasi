<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title description">
  <title id="title">Frasi system architecture</title>
  <desc id="description">An Excalidraw-inspired architecture map showing the Frasi browser studio, FastAPI application services, PostgreSQL, Redis, private object storage, Celery workers, and the audio-to-score transcription pipeline.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0d19"/>
      <stop offset="0.55" stop-color="#101221"/>
      <stop offset="1" stop-color="#0a0c16"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b68cff"/>
      <stop offset="1" stop-color="#7650ce"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd383"/>
      <stop offset="1" stop-color="#e89c45"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#a9a3c5" opacity="0.12"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#00010a" flood-opacity="0.38"/>
    </filter>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="17" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="arrow-violet" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 L11 6 L1 11 Z" fill="#a884ef"/>
    </marker>
    <marker id="arrow-amber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 L11 6 L1 11 Z" fill="#efb762"/>
    </marker>
    <marker id="arrow-muted" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 L11 6 L1 11 Z" fill="#767c97"/>
    </marker>
    <style>
      .title { fill: #f7f0e8; font: 700 34px Inter, "Segoe UI", sans-serif; letter-spacing: -0.8px; }
      .subtitle { fill: #aaa8ba; font: 500 15px Inter, "Segoe UI", sans-serif; letter-spacing: 0.2px; }
      .zone-title { fill: #ddd6eb; font: 700 15px Inter, "Segoe UI", sans-serif; letter-spacing: 2.2px; }
      .zone-note { fill: #817f94; font: 500 12px Inter, "Segoe UI", sans-serif; }
      .node-title { fill: #f6f0e9; font: 700 17px Inter, "Segoe UI", sans-serif; }
      .node-copy { fill: #aaa9ba; font: 500 12px Inter, "Segoe UI", sans-serif; }
      .node-micro { fill: #8b8a9d; font: 600 10.5px Inter, "Segoe UI", sans-serif; letter-spacing: 0.25px; }
      .edge-label { fill: #a8a5b7; font: 600 11px Inter, "Segoe UI", sans-serif; letter-spacing: 0.25px; }
      .badge { fill: #f4eee8; font: 700 10px Inter, "Segoe UI", sans-serif; letter-spacing: 1px; }
      .zone { fill: #141624; stroke: #35384d; stroke-width: 1.5; }
      .node { fill: #1a1c2c; stroke: #46495f; stroke-width: 1.5; }
      .node-violet { fill: #211c35; stroke: #8866d0; stroke-width: 1.7; }
      .node-amber { fill: #2b221d; stroke: #c78c4b; stroke-width: 1.7; }
      .small-node { fill: #171927; stroke: #3b3e52; stroke-width: 1.25; }
      .line { fill: none; stroke: #777c96; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .line-violet { fill: none; stroke: #a884ef; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
      .line-amber { fill: none; stroke: #efb762; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
      .line-dashed { fill: none; stroke: #676b84; stroke-width: 1.7; stroke-dasharray: 8 8; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="1600" height="1040" rx="26" fill="url(#canvas)"/>
  <rect width="1600" height="1040" rx="26" fill="url(#dots)"/>
  <path d="M0 118 H1600" stroke="#2c2f42" stroke-width="1"/>

  <!-- Brand and diagram title -->
  <g transform="translate(62 45)">
    <path d="M0 30 C18 2 35 59 52 23 C68 -7 86 55 105 17" fill="none" stroke="url(#amber)" stroke-width="4" stroke-linecap="round"/>
    <path d="M16 19 V41 M28 11 V47 M40 22 V37 M67 14 V44 M80 22 V37" stroke="url(#violet)" stroke-width="3.2" stroke-linecap="round"/>
    <text x="130" y="30" class="title">frasi. system architecture</text>
    <text x="130" y="56" class="subtitle">From authorized audio to an editable, practice-ready concert-pitch score</text>
  </g>
  <g transform="translate(1284 42)">
    <rect x="0" y="0" width="116" height="32" rx="16" fill="#282039" stroke="#7650ce"/>
    <circle cx="18" cy="16" r="4" fill="#b990ff"/>
    <text x="30" y="20" class="badge">PUBLIC WEB</text>
    <rect x="126" y="0" width="120" height="32" rx="16" fill="#2a231c" stroke="#b67e43"/>
    <circle cx="144" cy="16" r="4" fill="#f4bd6c"/>
    <text x="156" y="20" class="badge">PRIVATE DATA</text>
  </g>

  <!-- Architecture zones -->
  <g filter="url(#shadow)">
    <rect class="zone" x="48" y="148" width="406" height="724" rx="28"/>
    <rect class="zone" x="493" y="148" width="358" height="724" rx="28"/>
    <rect class="zone" x="890" y="148" width="662" height="724" rx="28"/>
  </g>
  <text x="78" y="186" class="zone-title">EXPERIENCE</text>
  <text x="78" y="208" class="zone-note">Next.js application · browser runtime</text>
  <text x="523" y="186" class="zone-title">APPLICATION PLANE</text>
  <text x="523" y="208" class="zone-note">FastAPI · versioned domain services</text>
  <text x="920" y="186" class="zone-title">DATA &amp; COMPUTE</text>
  <text x="920" y="208" class="zone-note">Durable state · queues · transcription workers</text>

  <!-- Cross-zone data flow, deliberately behind the nodes -->
  <g filter="url(#rough)">
    <path class="line-violet" d="M414 350 C458 350 472 285 523 285" marker-end="url(#arrow-violet)"/>
    <path class="line" d="M808 285 C858 285 873 270 926 270" marker-end="url(#arrow-muted)"/>
    <path class="line" d="M808 302 C878 302 950 270 1124 270" marker-end="url(#arrow-muted)"/>
    <path class="line" d="M808 320 C900 320 1100 270 1322 270" marker-end="url(#arrow-muted)"/>
    <path class="line-violet" d="M808 690 C930 690 1036 413 1124 413" marker-end="url(#arrow-violet)"/>
    <path class="line-amber" d="M1452 629 C1505 690 1458 795 1365 795" marker-end="url(#arrow-amber)"/>
    <path class="line-dashed" d="M1320 810 C1090 935 472 938 276 789" marker-end="url(#arrow-muted)"/>
  </g>
  <g>
    <rect x="430" y="293" width="112" height="24" rx="12" fill="#11131f" stroke="#45495f"/>
    <text x="486" y="309" class="edge-label" text-anchor="middle">HTTPS · JSON</text>
    <rect x="846" y="234" width="85" height="24" rx="12" fill="#11131f" stroke="#45495f"/>
    <text x="888" y="250" class="edge-label" text-anchor="middle">SQL</text>
    <rect x="853" y="339" width="122" height="24" rx="12" fill="#11131f" stroke="#45495f"/>
    <text x="914" y="355" class="edge-label" text-anchor="middle">job envelope</text>
    <rect x="688" y="897" width="184" height="24" rx="12" fill="#11131f" stroke="#45495f"/>
    <text x="780" y="913" class="edge-label" text-anchor="middle">score · progress · exports</text>
  </g>

  <!-- Experience plane -->
  <g filter="url(#shadow)">
    <rect class="node" x="94" y="230" width="314" height="70" rx="20"/>
    <rect class="node-violet" x="82" y="326" width="332" height="110" rx="22"/>
    <rect class="small-node" x="82" y="478" width="156" height="116" rx="20"/>
    <rect class="small-node" x="258" y="478" width="156" height="116" rx="20"/>
    <rect class="node" x="82" y="636" width="332" height="154" rx="22"/>
  </g>
  <g filter="url(#rough)">
    <path class="line-violet" d="M251 300 V324" marker-end="url(#arrow-violet)"/>
    <path class="line" d="M170 436 V474" marker-end="url(#arrow-muted)"/>
    <path class="line" d="M332 436 V474" marker-end="url(#arrow-muted)"/>
    <path class="line" d="M251 594 V632" marker-end="url(#arrow-muted)"/>
  </g>
  <g transform="translate(118 245)">
    <circle cx="22" cy="20" r="12" fill="none" stroke="#f0ba68" stroke-width="2"/>
    <path d="M2 54 C5 38 39 38 42 54" fill="none" stroke="#f0ba68" stroke-width="2" stroke-linecap="round"/>
    <text x="62" y="21" class="node-title">Musician</text>
    <text x="62" y="44" class="node-copy">authorized recording · corrections · practice</text>
  </g>
  <g transform="translate(108 348)">
    <rect x="0" y="0" width="54" height="42" rx="7" fill="none" stroke="#b78dff" stroke-width="2"/>
    <path d="M7 11 H47 M18 49 H36" stroke="#b78dff" stroke-width="2" stroke-linecap="round"/>
    <text x="76" y="19" class="node-title">Next.js studio</text>
    <text x="76" y="43" class="node-copy">React · Zustand · TanStack Query</text>
    <text x="76" y="64" class="node-micro">RESPONSIVE · ACCESSIBLE · REAL-TIME</text>
  </g>
  <g transform="translate(102 497)">
    <path d="M0 36 C7 9 14 61 21 28 C29 0 36 62 44 23 C51 8 58 44 66 31" fill="none" stroke="#efb762" stroke-width="2.3" stroke-linecap="round"/>
    <text x="0" y="72" class="node-title">Audio</text>
    <text x="0" y="93" class="node-copy">WaveSurfer · Web Audio</text>
  </g>
  <g transform="translate(278 496)">
    <path d="M12 3 V62 M35 3 V62" stroke="#a884ef" stroke-width="1.7"/>
    <path d="M2 21 H46 M2 30 H46 M2 39 H46 M2 48 H46 M2 57 H46" stroke="#a884ef" stroke-width="1.2"/>
    <circle cx="29" cy="31" r="4" fill="#a884ef"/><path d="M33 31 V14" stroke="#a884ef" stroke-width="2"/>
    <text x="0" y="72" class="node-title">Notation</text>
    <text x="0" y="93" class="node-copy">Verovio · click-to-seek</text>
  </g>
  <g transform="translate(108 658)">
    <text x="0" y="19" class="node-title">Learning workspace</text>
    <text x="0" y="44" class="node-copy">12-key practice · vocabulary · mastery history</text>
    <g transform="translate(0 70)">
      <rect width="76" height="34" rx="12" fill="#2a2340" stroke="#7650ce"/>
      <text x="38" y="22" class="badge" text-anchor="middle">PRACTICE</text>
      <rect x="88" width="88" height="34" rx="12" fill="#242634" stroke="#4c5065"/>
      <text x="132" y="22" class="badge" text-anchor="middle">LIBRARY</text>
      <rect x="188" width="92" height="34" rx="12" fill="#2e251d" stroke="#b67e43"/>
      <text x="234" y="22" class="badge" text-anchor="middle">PLAYBACK</text>
    </g>
  </g>

  <!-- Application plane -->
  <g filter="url(#shadow)">
    <rect class="node-violet" x="523" y="230" width="285" height="110" rx="22"/>
    <rect class="node" x="523" y="390" width="285" height="78" rx="20"/>
    <rect class="node" x="523" y="516" width="285" height="106" rx="20"/>
    <rect class="node-violet" x="523" y="660" width="285" height="72" rx="20"/>
    <rect class="node-amber" x="523" y="776" width="285" height="62" rx="20"/>
  </g>
  <g filter="url(#rough)">
