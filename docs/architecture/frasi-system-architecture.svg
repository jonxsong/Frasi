    <path class="line" d="M665 468 V512" marker-end="url(#arrow-muted)"/>
    <path class="line-violet" d="M665 622 V656" marker-end="url(#arrow-violet)"/>
    <path class="line-amber" d="M665 732 V772" marker-end="url(#arrow-amber)"/>
  </g>
  <g transform="translate(550 250)">
    <path d="M0 13 L25 0 L50 13 V42 L25 55 L0 42 Z" fill="none" stroke="#b78dff" stroke-width="2"/>
    <path d="M12 18 H38 M12 28 H38 M12 38 H28" stroke="#b78dff" stroke-width="2" stroke-linecap="round"/>
    <text x="75" y="21" class="node-title">FastAPI</text>
    <text x="75" y="45" class="node-copy">/api/v1 · validation · OpenAPI</text>
    <text x="75" y="66" class="node-micro">REQUEST IDS · RATE LIMITS</text>
  </g>
  <g transform="translate(550 409)">
    <path d="M9 20 V11 C9 -2 31 -2 31 11 V20 M3 20 H37 V50 H3 Z" fill="none" stroke="#a9acc0" stroke-width="2"/>
    <circle cx="20" cy="33" r="3" fill="#efb762"/>
    <text x="61" y="22" class="node-title">Identity &amp; policy</text>
    <text x="61" y="44" class="node-copy">rotating JWT sessions · ownership</text>
  </g>
  <g transform="translate(550 535)">
    <path d="M0 6 H46 V53 H0 Z M8 17 H38 M8 28 H38 M8 39 H30" fill="none" stroke="#a9acc0" stroke-width="2" stroke-linejoin="round"/>
    <text x="65" y="18" class="node-title">Score domain</text>
    <text x="65" y="41" class="node-copy">immutable revisions · harmony</text>
    <text x="65" y="62" class="node-copy">practice · vocabulary · exports</text>
  </g>
  <g transform="translate(550 677)">
    <path d="M0 17 H42 M31 6 L42 17 L31 28" fill="none" stroke="#b78dff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="62" y="18" class="node-title">Job dispatcher</text>
    <text x="62" y="41" class="node-copy">idempotency · retries · progress</text>
  </g>
  <g transform="translate(548 795)">
    <text x="0" y="18" class="node-title">MusicXML · MIDI · PDF</text>
    <text x="0" y="40" class="node-copy">versioned, authorization-aware exports</text>
  </g>

  <!-- Data and compute plane -->
  <g filter="url(#shadow)">
    <rect class="small-node" x="926" y="230" width="160" height="92" rx="20"/>
    <rect class="small-node" x="1124" y="230" width="160" height="92" rx="20"/>
    <rect class="node-amber" x="1322" y="230" width="194" height="92" rx="20"/>
